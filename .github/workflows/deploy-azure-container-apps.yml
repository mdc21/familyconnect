name: Deploy to Azure Container Apps (Pilot)

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Test Suite (38 Tests)
        run: npm test

  deploy:
    name: Deploy to Azure Container Apps
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and Push Image to ACR
        run: |
          az acr build \
            --registry ${{ secrets.AZURE_ACR_NAME }} \
            --image familyconnect:${{ github.sha }} \
            --image familyconnect:latest \
            .

      - name: Deploy Revision to Azure Container Apps
        run: |
          az containerapp update \
            --name familyconnect \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP || 'rg-familyconnect-pilot' }} \
            --image ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/familyconnect:${{ github.sha }}
