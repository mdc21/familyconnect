name: Deploy to Azure Container Apps (Pilot)

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: familyconnect
          POSTGRES_PASSWORD: familyconnect
          POSTGRES_DB: familyconnect
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Seed Test Database
        run: npm run db:seed
        env:
          DATABASE_URL: postgres://familyconnect:familyconnect@localhost:5432/familyconnect

      - name: Execute Test Suite (44 Tests)
        run: npm test
        env:
          DATABASE_URL: postgres://familyconnect:familyconnect@localhost:5432/familyconnect

  deploy:
    name: Deploy to Azure Container Apps
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and Push Image to ACR
        run: |
          az acr build \
            --registry ${{ secrets.AZURE_ACR_NAME }} \
            --image familyconnect:${{ github.sha }} \
            --image familyconnect:latest \
            .

      - name: Deploy Revision to Azure Container Apps
        run: |
          az acr update --name ${{ secrets.AZURE_ACR_NAME }} --admin-enabled true
          ACR_PASSWORD=$(az acr credential show --name ${{ secrets.AZURE_ACR_NAME }} --query "passwords[0].value" -o tsv)
          az containerapp registry set \
            --name familyconnect \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP || 'rg-familyconnect-pilot' }} \
            --server ${{ secrets.AZURE_ACR_NAME }}.azurecr.io \
            --username ${{ secrets.AZURE_ACR_NAME }} \
            --password "$ACR_PASSWORD"
          az containerapp update \
            --name familyconnect \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP || 'rg-familyconnect-pilot' }} \
            --image ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/familyconnect:${{ github.sha }}
