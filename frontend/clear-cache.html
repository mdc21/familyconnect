<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clearing cache…</title>
  <style>
    body { font-family: system-ui, sans-serif; display: flex; flex-direction: column;
           align-items: center; justify-content: center; min-height: 100vh;
           background: #f8fafc; color: #0f172a; margin: 0; }
    .box { background: #fff; border: 1px solid #cbd5e1; border-radius: 8px;
           padding: 2rem 3rem; max-width: 480px; text-align: center; }
    h1 { font-size: 1.25rem; margin-bottom: 1rem; }
    #status { color: #475569; margin: 0.5rem 0; font-size: 0.9rem; }
    .spinner { border: 3px solid #e2e8f0; border-top-color: #1b4d3e;
               border-radius: 50%; width: 36px; height: 36px;
               animation: spin 0.8s linear infinite; margin: 1rem auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h1>Clearing browser cache…</h1>
    <p id="status">Unregistering service workers…</p>
  </div>
  <script>
    const status = document.getElementById('status');
    async function clearAll() {
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r => r.unregister()));
        status.textContent = 'Unregistered ' + regs.length + ' service worker(s)…';
      }
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
      status.textContent = 'Cleared ' + keys.length + ' cache(s). Redirecting to home…';
      setTimeout(() => { window.location.href = '/index.html'; }, 1200);
    }
    clearAll().catch(err => {
      status.textContent = 'Error: ' + err.message;
    });
  </script>
</body>
</html>
